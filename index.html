<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspection Record</title>
  <style>
    :root {
      --primary-color: #007aff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --border-color: #e5e5ea;
      --text-color: #000000;
      --secondary-text: #8e8e93;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-color); }
    
    /* Navigation Bar */
    .nav-bar { position: sticky; top: 0; background: #f9f9f9; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; z-index: 100; }
    .nav-bar .btn-nav { color: var(--primary-color); font-size: 1rem; background: none; border: none; cursor: pointer; font-weight: 500; }
    .nav-bar .title { font-weight: 600; font-size: 1.1rem; }
    .nav-bar .btn-add { font-size: 1.5rem; line-height: 1; }

    /* Views */
    .view { display: none; padding: 16px; }
    .view.active { display: block; }

    /* Record List */
    .record-list { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); }
    .record-item { padding: 14px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .record-item:last-child { border-bottom: none; }
    .record-title { font-size: 1rem; font-weight: 500; margin-bottom: 4px; color: #1c1c1e; }
    .record-subtitle { font-size: 0.85rem; color: var(--secondary-text); }
    .empty-state { text-align: center; color: var(--secondary-text); padding: 40px 20px; font-size: 0.95rem; }

    /* Form Styles */
    .form-card { background: var(--card-bg); border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.8rem; color: #3a3a3c; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; background: #fff; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .section-title { font-weight: 700; font-size: 0.85rem; color: var(--secondary-text); text-transform: uppercase; margin: 16px 0 8px 4px; }
    
    /* Counter Styles */
    .counter-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .counter-row:last-child { border-bottom: none; }
    .counter-label { font-size: 0.95rem; font-weight: 500; }
    .counter-controls { display: flex; align-items: center; gap: 12px; }
    .btn-counter { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--primary-color); background: #fff; color: var(--primary-color); font-size: 1.2rem; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .counter-value { font-size: 1rem; font-weight: 600; min-width: 20px; text-align: center; }

    .btn-action { background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- VIEW 1: Inspection Record List -->
  <div id="list-view" class="view active">
    <div class="nav-bar">
      <button class="btn-nav" id="btn-edit" onclick="toggleEditMode()">Edit</button>
      <div class="title">Inspection Record</div>
      <button class="btn-nav btn-add" onclick="showFormView()">+</button>
    </div>
    <div style="padding-top: 16px;">
      <div class="record-list" id="records-container"></div>
    </div>
  </div>

  <!-- VIEW 2: New Inspection Form -->
  <div id="form-view" class="view">
    <div class="nav-bar">
      <button class="btn-nav" onclick="showListView()">Cancel</button>
      <div class="title">New Inspection</div>
      <button class="btn-nav" onclick="nextToRoomSetup()">Next</button>
    </div>

    <form id="inspection-form" style="padding-top: 16px;" onsubmit="event.preventDefault();">
      <!-- General Building Information -->
      <div class="section-title">General Information</div>
      <div class="form-card">
        <div class="form-group">
          <label>ADDRESS / TITLE</label>
          <input type="text" id="inp-address" placeholder="e.g. 33 Wilson Row-Fredericton" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>PROJECT NO. / ID</label>
            <input type="text" id="inp-project" placeholder="e.g. P020-299938">
          </div>
          <div class="form-group">
            <label>START DATE</label>
            <input type="date" id="inp-date" required>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>LANDLORD</label>
            <input type="text" id="inp-landlord">
          </div>
          <div class="form-group">
            <label>TENANT</label>
            <input type="text" id="inp-tenant">
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>AGE</label>
            <input type="text" id="inp-age" placeholder="e.g. 10 years">
          </div>
          <div class="form-group">
            <label>TOTAL NO. OF UNITS</label>
            <input type="number" id="inp-units">
          </div>
        </div>
      </div>

      <!-- Building Condition Overview -->
      <div class="section-title">Building Condition</div>
      <div class="form-card">
        <div class="grid-2">
          <div class="form-group">
            <label>APPEARANCE</label>
            <input type="text" id="inp-appearance">
          </div>
          <div class="form-group">
            <label>FOUNDATION</label>
            <input type="text" id="inp-foundation">
          </div>
          <div class="form-group">
            <label>ROOF</label>
            <input type="text" id="inp-roof">
          </div>
          <div class="form-group">
            <label>WALLS</label>
            <input type="text" id="inp-walls">
          </div>
          <div class="form-group">
            <label>PARKING FACILITIES</label>
            <input type="text" id="inp-parking">
          </div>
          <div class="form-group">
            <label>HEATING SYSTEM</label>
            <input type="text" id="inp-heating">
          </div>
        </div>
      </div>

      <!-- Configure Property Rooms -->
      <div class="section-title">Configure Property Rooms</div>
      <div class="form-card">
        <div class="counter-row">
          <span class="counter-label">Kitchen</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('kitchen', -1)">-</button>
            <span class="counter-value" id="count-kitchen">1</span>
            <button type="button" class="btn-counter" onclick="changeCount('kitchen', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Dining Room</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('dining', -1)">-</button>
            <span class="counter-value" id="count-dining">1</span>
            <button type="button" class="btn-counter" onclick="changeCount('dining', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Bedroom</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('bedroom', -1)">-</button>
            <span class="counter-value" id="count-bedroom">2</span>
            <button type="button" class="btn-counter" onclick="changeCount('bedroom', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Bathroom</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('bath', -1)">-</button>
            <span class="counter-value" id="count-bath">1</span>
            <button type="button" class="btn-counter" onclick="changeCount('bath', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Living Room</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('living', -1)">-</button>
            <span class="counter-value" id="count-living">1</span>
            <button type="button" class="btn-counter" onclick="changeCount('living', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Hallway / Corridor</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('hallway', -1)">-</button>
            <span class="counter-value" id="count-hallway">1</span>
            <button type="button" class="btn-counter" onclick="changeCount('hallway', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Basement</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('basement', -1)">-</button>
            <span class="counter-value" id="count-basement">0</span>
            <button type="button" class="btn-counter" onclick="changeCount('basement', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Stairs</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('stairs', -1)">-</button>
            <span class="counter-value" id="count-stairs">0</span>
            <button type="button" class="btn-counter" onclick="changeCount('stairs', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Garage</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('garage', -1)">-</button>
            <span class="counter-value" id="count-garage">0</span>
            <button type="button" class="btn-counter" onclick="changeCount('garage', 1)">+</button>
          </div>
        </div>

        <div class="counter-row">
          <span class="counter-label">Shed</span>
          <div class="counter-controls">
            <button type="button" class="btn-counter" onclick="changeCount('shed', -1)">-</button>
            <span class="counter-value" id="count-shed">0</span>
            <button type="button" class="btn-counter" onclick="changeCount('shed', 1)">+</button>
          </div>
        </div>
      </div>

      <button type="button" class="btn-action" onclick="nextToRoomSetup()">Start Room Inspection</button>
    </form>
  </div>

  <!-- VIEW 3: Allocated Room Selection -->
  <div id="room-list-view" class="view">
    <div class="nav-bar">
      <button class="btn-nav" onclick="showFormView()">Back</button>
      <div class="title" id="room-view-title">Room Selection</div>
      <button class="btn-nav" onclick="saveCompleteRecord()">Done</button>
    </div>
    
    <div style="padding-top: 16px;">
      <div class="section-title">Select a Room to Inspect</div>
      <div class="record-list" id="allocated-rooms-container"></div>
    </div>
  </div>

<script>
  let isEditMode = false;
  let roomCounts = { 
    kitchen: 1, 
    dining: 1, 
    bedroom: 2, 
    bath: 1, 
    living: 1, 
    hallway: 1, 
    basement: 0, 
    stairs: 0, 
    garage: 0, 
    shed: 0 
  };
  let currentConfiguredRooms = [];

  document.getElementById('inp-date').valueAsDate = new Date();

  function getRecords() {
    return JSON.parse(localStorage.getItem('inspection_records') || '[]');
  }

  function saveRecords(records) {
    localStorage.setItem('inspection_records', JSON.stringify(records));
  }

  function renderList() {
    const records = getRecords();
    const container = document.getElementById('records-container');
    
    if (records.length === 0) {
      container.innerHTML = '<div class="empty-state">No inspection records yet.<br>Tap + to create one.</div>';
      return;
    }

    container.innerHTML = records.map((item, index) => `
      <div class="record-item" onclick="onItemClick(${index})">
        <div>
          <div class="record-title">${item.address || 'Untitled Inspection'}</div>
          <div class="record-subtitle">${item.date} ${item.project ? '· ' + item.project : ''}</div>
        </div>
        ${isEditMode ? `<button style="color:red;border:none;background:none;" onclick="deleteRecord(event, ${index})">Delete</button>` : '<span style="color:#c7c7cc;">›</span>'}
      </div>
    `).join('');
  }

  function changeCount(type, delta) {
    if (roomCounts[type] + delta >= 0) {
      roomCounts[type] += delta;
      document.getElementById(`count-${type}`).innerText = roomCounts[type];
    }
  }

  function showFormView() {
    document.getElementById('list-view').classList.remove('active');
    document.getElementById('room-list-view').classList.remove('active');
    document.getElementById('form-view').classList.add('active');
  }

  function showListView() {
    document.getElementById('form-view').classList.remove('active');
    document.getElementById('room-list-view').classList.remove('active');
    document.getElementById('list-view').classList.add('active');
    renderList();
  }

  function nextToRoomSetup() {
    const address = document.getElementById('inp-address').value;
    if (!address) {
      alert('Please fill in the Address / Title.');
      return;
    }

    currentConfiguredRooms = [];
    
    const categories = [
      { key: 'kitchen', label: 'Kitchen' },
      { key: 'dining', label: 'Dining Room' },
      { key: 'bedroom', label: 'Bedroom' },
      { key: 'bath', label: 'Bathroom' },
      { key: 'living', label: 'Living Room' },
      { key: 'hallway', label: 'Hallway' },
      { key: 'basement', label: 'Basement' },
      { key: 'stairs', label: 'Stairs' },
      { key: 'garage', label: 'Garage' },
      { key: 'shed', label: 'Shed' }
    ];

    categories.forEach(cat => {
      const count = roomCounts[cat.key];
      for (let i = 1; i <= count; i++) {
        currentConfiguredRooms.push({
          name: count > 1 ? `${cat.label} ${i}` : cat.label,
          status: 'Pending'
        });
      }
    });

    renderRoomSelection();
    document.getElementById('form-view').classList.remove('active');
    document.getElementById('room-list-view').classList.add('active');
  }

  function renderRoomSelection() {
    const container = document.getElementById('allocated-rooms-container');
    container.innerHTML = currentConfiguredRooms.map((room, idx) => `
      <div class="record-item" onclick="inspectRoom(${idx})">
        <div>
          <div class="record-title">${room.name}</div>
          <div class="record-subtitle">Status: ${room.status}</div>
        </div>
        <span style="color:var(--primary-color); font-weight: 500;">Inspect ›</span>
      </div>
    `).join('');
  }

  function inspectRoom(index) {
    alert(`Starting inspection for: ${currentConfiguredRooms[index].name}`);
  }

  function saveCompleteRecord() {
    const address = document.getElementById('inp-address').value;
    const date = document.getElementById('inp-date').value;
    const project = document.getElementById('inp-project').value;

    const newRecord = {
      id: Date.now(),
      address: address,
      project: project,
      date: date,
      landlord: document.getElementById('inp-landlord').value,
      tenant: document.getElementById('inp-tenant').value,
      age: document.getElementById('inp-age').value,
      units: document.getElementById('inp-units').value,
      appearance: document.getElementById('inp-appearance').value,
      foundation: document.getElementById('inp-foundation').value,
      roof: document.getElementById('inp-roof').value,
      walls: document.getElementById('inp-walls').value,
      parking: document.getElementById('inp-parking').value,
      heating: document.getElementById('inp-heating').value,
      rooms: currentConfiguredRooms
    };

    const records = getRecords();
    records.unshift(newRecord);
    saveRecords(records);

    document.getElementById('inspection-form').reset();
    showListView();
  }

  function toggleEditMode() {
    isEditMode = !isEditMode;
    document.getElementById('btn-edit').innerText = isEditMode ? 'Done' : 'Edit';
    renderList();
  }

  function deleteRecord(event, index) {
    event.stopPropagation();
    let records = getRecords();
    records.splice(index, 1);
    saveRecords(records);
    renderList();
  }

  function onItemClick(index) {
    if (isEditMode) return;
    const records = getRecords();
    const item = records[index];
    alert(`Viewing Record: ${item.address}\nRooms: ${item.rooms ? item.rooms.map(r => r.name).join(', ') : 'None'}`);
  }

  renderList();
</script>
</body>
</html>
