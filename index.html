<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspection Record</title>
  <style>
    :root {
      --primary-color: #007aff;
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --border-color: #e5e5ea;
      --text-color: #000000;
      --secondary-text: #8e8e93;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-color); }
    
    /* 顶部导航 */
    .nav-bar { position: sticky; top: 0; background: #f9f9f9; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; z-index: 100; }
    .nav-bar .btn-nav { color: var(--primary-color); font-size: 1rem; background: none; border: none; cursor: pointer; font-weight: 500; }
    .nav-bar .title { font-weight: 600; font-size: 1.1rem; }
    .nav-bar .btn-add { font-size: 1.5rem; line-height: 1; }

    /* 视图切换 */
    .view { display: none; padding: 16px; }
    .view.active { display: block; }

    /* 首页列表 */
    .record-list { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); }
    .record-item { padding: 14px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .record-item:last-child { border-bottom: none; }
    .record-title { font-size: 1rem; font-weight: 500; margin-bottom: 4px; color: #1c1c1e; }
    .record-subtitle { font-size: 0.85rem; color: var(--secondary-text); }
    .empty-state { text-align: center; color: var(--secondary-text); padding: 40px 20px; font-size: 0.95rem; }

    /* 表单与卡片样式 */
    .form-card { background: var(--card-bg); border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: #3a3a3c; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; background: #fff; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .section-title { font-weight: 700; font-size: 0.9rem; color: var(--secondary-text); text-transform: uppercase; margin: 16px 0 8px 4px; }
    
    .check-table { width: 100%; border-collapse: collapse; }
    .check-table td { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .check-table td:last-child { width: 120px; }

    canvas { border: 1px dashed var(--secondary-text); border-radius: 8px; background: #fafafa; width: 100%; height: 100px; touch-action: none; }
    .btn-clear { background: #ff3b30; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; float: right; margin-top: 4px; }
    
    .btn-save { background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; }

    @media print {
      .nav-bar, .btn-save, .btn-clear { display: none !important; }
      .view { display: block !important; padding: 0; }
      #list-view { display: none !important; }
      body { background: white; }
    }
  </style>
</head>
<body>

  <!-- 视图 1：首页列表页 -->
  <div id="list-view" class="view active">
    <div class="nav-bar">
      <button class="btn-nav" id="btn-edit" onclick="toggleEditMode()">Edit</button>
      <div class="title">Inspection Record</div>
      <button class="btn-nav btn-add" onclick="showFormView()">+</button>
    </div>
    <div style="padding-top: 16px;">
      <div class="record-list" id="records-container"></div>
    </div>
  </div>

  <!-- 视图 2：新增/编辑表格页 -->
  <div id="form-view" class="view">
    <div class="nav-bar">
      <button class="btn-nav" onclick="showListView()"> Cancel</button>
      <div class="title">New Inspection</div>
      <button class="btn-nav" onclick="saveInspection()">Save</button>
    </div>

    <form id="inspection-form" style="padding-top: 16px;">
      <div class="form-card">
        <div class="form-group">
          <label>ADDRESS / TITLE</label>
          <input type="text" id="inp-address" placeholder="e.g. 33 Wilson Row-Fredericton" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>PROJECT NO. / ID</label>
            <input type="text" id="inp-project" placeholder="e.g. P020-299938">
          </div>
          <div class="form-group">
            <label>START DATE</label>
            <input type="date" id="inp-date" required>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>LANDLORD</label>
            <input type="text" id="inp-landlord">
          </div>
          <div class="form-group">
            <label>TENANT</label>
            <input type="text" id="inp-tenant">
          </div>
        </div>
      </div>

      <!-- 检查项区块 -->
      <div class="section-title">Areas & Items</div>
      <div class="form-card">
        <table class="check-table">
          <tr><td>Kitchen</td><td><select id="status-kitchen"><option>Satisfactory</option><option>Unsatisfactory</option></select></td></tr>
          <tr><td>Bathroom</td><td><select id="status-bath"><option>Satisfactory</option><option>Unsatisfactory</option></select></td></tr>
          <tr><td>Living Room</td><td><select id="status-living"><option>Satisfactory</option><option>Unsatisfactory</option></select></td></tr>
          <tr><td>Heating System</td><td><select id="status-heating"><option>Satisfactory</option><option>Unsatisfactory</option></select></td></tr>
        </table>
      </div>

      <div class="form-card">
        <div class="form-group">
          <label>COMMENTS</label>
          <textarea id="inp-comments" rows="3"></textarea>
        </div>
      </div>

      <!-- 签名区块 -->
      <div class="section-title">Signatures</div>
      <div class="form-card grid-2">
        <div>
          <label>Landlord Signature</label>
          <canvas id="canvas-landlord"></canvas>
          <button type="button" class="btn-clear" onclick="clearCanvas('canvas-landlord')">Clear</button>
        </div>
        <div>
          <label>Tenant Signature</label>
          <canvas id="canvas-tenant"></canvas>
          <button type="button" class="btn-clear" onclick="clearCanvas('canvas-tenant')">Clear</button>
        </div>
      </div>

      <button type="button" class="btn-save" onclick="saveInspection()">Save Inspection</button>
    </form>
  </div>

<script>
  let isEditMode = false;

  // 默认日期初始化为今天
  document.getElementById('inp-date').valueAsDate = new Date();

  function getRecords() {
    return JSON.parse(localStorage.getItem('inspection_records') || '[]');
  }

  function saveRecords(records) {
    localStorage.setItem('inspection_records', JSON.stringify(records));
  }

  function renderList() {
    const records = getRecords();
    const container = document.getElementById('records-container');
    
    if (records.length === 0) {
      container.innerHTML = '<div class="empty-state">No inspection records yet.<br>Tap + to create one.</div>';
      return;
    }

    // 按时间/创建顺序倒序
    container.innerHTML = records.map((item, index) => `
      <div class="record-item" onclick="onItemClick(${index})">
        <div>
          <div class="record-title">${item.address || 'Untitled Inspection'}</div>
          <div class="record-subtitle">${item.date} ${item.project ? '· ' + item.project : ''}</div>
        </div>
        ${isEditMode ? `<button style="color:red;border:none;background:none;" onclick="deleteRecord(event, ${index})">Delete</button>` : '<span style="color:#c7c7cc;">›</span>'}
      </div>
    `).join('');
  }

  function showFormView() {
    document.getElementById('list-view').classList.remove('active');
    document.getElementById('form-view').classList.add('active');
    setTimeout(() => {
      initCanvas('canvas-landlord');
      initCanvas('canvas-tenant');
    }, 100);
  }

  function showListView() {
    document.getElementById('form-view').classList.remove('active');
    document.getElementById('list-view').classList.add('active');
    renderList();
  }

  function toggleEditMode() {
    isEditMode = !isEditMode;
    document.getElementById('btn-edit').innerText = isEditMode ? 'Done' : 'Edit';
    renderList();
  }

  function deleteRecord(event, index) {
    event.stopPropagation();
    let records = getRecords();
    records.splice(index, 1);
    saveRecords(records);
    renderList();
  }

  function saveInspection() {
    const address = document.getElementById('inp-address').value;
    const date = document.getElementById('inp-date').value;
    const project = document.getElementById('inp-project').value;
    
    if (!address) {
      alert('Please fill in the Address/Title.');
      return;
    }

    const newRecord = {
      id: Date.now(),
      address: address,
      project: project,
      date: date,
      landlord: document.getElementById('inp-landlord').value,
      tenant: document.getElementById('inp-tenant').value,
      comments: document.getElementById('inp-comments').value
    };

    const records = getRecords();
    records.unshift(newRecord); // 插入最前面
    saveRecords(records);

    // 重置表单并返回列表
    document.getElementById('inspection-form').reset();
    document.getElementById('inp-date').valueAsDate = new Date();
    showListView();
  }

  function onItemClick(index) {
    if (isEditMode) return;
    const records = getRecords();
    const item = records[index];
    alert(`Viewing Record:\nAddress: ${item.address}\nDate: ${item.date}\nProject: ${item.project}`);
  }

  // 签名 Canvas 初始化逻辑
  function initCanvas(id) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    let drawing = false;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.onmousedown = canvas.ontouchstart = (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
    canvas.onmousemove = canvas.ontouchmove = (e) => { if (drawing) { const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); } };
    canvas.onmouseup = canvas.ontouchend = () => { drawing = false; };
  }

  function clearCanvas(id) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // 初始化渲染
  renderList();
</script>
</body>
</html>
